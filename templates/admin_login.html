<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>後台登入｜幸福銀行 金融任務</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login">
<form method="post" action="/admin/login" class="box">
  <h1>後台登入</h1>
  <p class="mut">幸福銀行 金融任務・玩家管理</p>
  <label for="pw">管理密碼</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  {% if error %}<p class="err">密碼不正確。</p>{% endif %}
  <button type="submit" class="primary">登入</button>
  <p class="mut small">密碼在啟動時以環境變數 ADMIN_PASSWORD 設定；沒設定的話，終端機會印出本次的臨時密碼。</p>
</form>
</body>
</html>
